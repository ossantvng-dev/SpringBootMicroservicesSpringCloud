input {
  file {
    # The shared photo-app-logs volume, written by all eight components via
    # LOG_BASE. Replaces the old host bind mount of api-parent/services.
    path => "/var/log/photo-app/**/logs/*.log"
    codec => json
    start_position => "beginning"
    # Persisted on the photo-app-logstash-data volume. The previous /dev/null
    # setting made every restart re-ingest every file from the beginning and
    # duplicate documents in Elasticsearch.
    sincedb_path => "/usr/share/logstash/data/sincedb_photoapp"
  }
}

filter {
  # logback already emits traceId/spanId; promoting them keeps log-to-trace
  # correlation usable from Kibana without a scripted field.
  if [traceId] {
    mutate { add_field => { "[@metadata][correlated]" => "true" } }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "photoapp-logs-%{+YYYY.MM.dd}"
    # xpack.security is enabled, so Logstash must authenticate and trust the CA
    # generated by the certs bootstrap container.
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
  }
}
