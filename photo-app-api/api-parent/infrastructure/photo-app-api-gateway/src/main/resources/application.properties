server.port=8080
spring.application.name=photo-app-api-gateway
spring.profiles.active=dev
# Host is overridable so containers can point at the compose service name.
# The default keeps native local runs working unchanged.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_ADMIN_USER}
spring.cloud.config.password=${CONFIG_SERVER_ADMIN_PASSWORD}

# Gateway MVC's DefaultFunctionConfiguration registers a catch-all router function
# whenever spring-cloud-function-context is on the classpath, and it defaults to on
# (@ConditionalOnProperty(..., matchIfMissing = true)). spring-cloud-starter-bus-amqp
# drags that class in, so every unrouted path - including Swagger UI's static webjar
# resources - was being handed to RoutingFunction and rejected with a 415 before
# the resource handler ever saw it. No route here uses fn://, so this is dead weight.
# Not to be confused with spring.cloud.function.web.enabled, which is a no-op here.
spring.cloud.gateway.server.webmvc.function.enabled=false
