spring.application.name=photo-app-discovery-service
spring.profiles.active=dev
# Host is overridable so containers can point at the compose service name.
# The default keeps native local runs working unchanged.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_ADMIN_USER}
spring.cloud.config.password=${CONFIG_SERVER_ADMIN_PASSWORD}
