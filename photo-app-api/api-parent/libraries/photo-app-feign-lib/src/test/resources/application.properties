# =====================================================================================
# Phase 4 test configuration.
#
# The Resilience4j block below mirrors the SEMANTICS of the config repo's dev profile
# exactly - same predicate wiring, same window type and size, same minimumNumberOfCalls,
# same failureRateThreshold, same maxAttempts. Only the DURATIONS are shrunk:
#
#     waitDurationInOpenState   10s -> 200ms
#     retry waitDuration         2s -> 10ms
#
# Nothing else is changed, because everything else is the behaviour under test. Verified
# against the running config server on 2026-08-07 by fetching
# /photo-app-{users,accounts,albums,photos,authorization}-service/dev - all five share one
# identical default config, and every instance is baseConfig=default.
#
# The durations are the only reason a real cycle takes tens of seconds, which is what
# testing-plan.md's open question 3 resolved to avoid.
# =====================================================================================

spring.application.name=photo-app-feign-lib-test
spring.main.banner-mode=off

# Instances are supplied per-test by AbstractFeignClientTest's @DynamicPropertySource,
# pointing SimpleDiscoveryClient at WireMock's dynamic port.
eureka.client.enabled=false

# Keeps a hung stub from stalling the suite; production leaves these at Feign's defaults.
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000

resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=200ms
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=50
# false only because this context has no actuator; production registers the indicator.
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=false
resilience4j.circuitbreaker.configs.default.recordFailurePredicate=com.photoapp.feign.resilience.DownstreamFailurePredicate

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=10ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2
resilience4j.retry.configs.default.retryExceptionPredicate=com.photoapp.feign.resilience.DownstreamFailurePredicate

# -------------------------------------------------------------------------------------
# Test-only instances, attached to no Feign method. CircuitBreakerStateTransitionTest
# drives these from the registry directly, per testing-plan.md open question 3, so the
# state machine can be asserted without any downstream traffic at all.
# -------------------------------------------------------------------------------------
resilience4j.circuitbreaker.instances.test-transition.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.test-transition.slidingWindowSize=4
resilience4j.circuitbreaker.instances.test-transition.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.test-transition.failureRateThreshold=50
resilience4j.circuitbreaker.instances.test-transition.waitDurationInOpenState=50ms
resilience4j.circuitbreaker.instances.test-transition.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.test-transition.automaticTransitionFromOpenToHalfOpenEnabled=false
resilience4j.circuitbreaker.instances.test-transition.registerHealthIndicator=false
resilience4j.circuitbreaker.instances.test-transition.recordFailurePredicate=com.photoapp.feign.resilience.DownstreamFailurePredicate

logging.level.root=WARN
logging.level.com.photoapp=INFO
