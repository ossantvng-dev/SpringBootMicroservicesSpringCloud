# Step 7 - infrastructure only. Application services arrive in Step 8.
#
# All backing services are dedicated to this project: the standalone mysql-v8,
# rabbitmq and zipkin containers on the host are deliberately not reused, and the
# standard ports are used because those containers are not running (decision 3).
#
# ONE-SHOT INIT JOBS
# photo-app-liquibase, photo-app-elk-certs and photo-app-elk-users run once and
# exit. They stay listed as "Exited (0)" afterwards because the Compose
# specification has no declarative auto-remove - there is no auto_remove/rm key,
# and `up` has no equivalent of `docker run --rm`. Removing them at the end of a
# run therefore has to happen outside the file:
#
#     tools/local/stack.sh up      # up -d, then remove the finished init jobs
#     tools/local/stack.sh clean   # remove them without restarting anything
#
# The gating below (depends_on: condition: service_completed_successfully) is
# what makes the ordering correct, so it is kept here rather than moved into the
# script: a plain `docker compose up -d` still produces a correct stack, just
# with three tidy-up containers left behind. All three jobs are idempotent, so
# removing and re-running them is safe.

name: photo-app

networks:
  photo-app-net:
    name: photo-app-net

volumes:
  photo-app-mysql-data:
  photo-app-es-data:
  photo-app-certs:
  # Shared by every application container and by Logstash. LOG_BASE points the
  # logback config here, so all eight components write into one place.
  photo-app-logs:
  # Without a persisted sincedb Logstash re-ingests every file from the beginning
  # on each restart and duplicates documents in Elasticsearch.
  photo-app-logstash-data:
  photo-app-maven-cache:

# Shared by every Config Server client. Defined at top level rather than on one
# service, so that no service can accidentally inherit another's identity.
x-config-client: &config-client
  SPRING_PROFILES_ACTIVE: dev
  # Overrides the host inside the packaged spring.config.import. Together with
  # fail-fast below this makes an unreachable Config Server a loud failure rather
  # than a silent boot with no configuration.
  CONFIG_SERVER_URL: http://photo-app-config-server:8888
  SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_ADMIN_USER}
  SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_ADMIN_PASSWORD}
  SPRING_CLOUD_CONFIG_FAIL_FAST: "true"

services:

  # ------------------------------------------------------------------ MySQL
  photo-app-mysql:
    image: mysql:8.4
    container_name: photo-app-mysql
    networks: [photo-app-net]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photo_app}
      MYSQL_USER: ${MYSQL_USER:-photo_app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - photo-app-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------------------------------- Liquibase (one-shot)
  # Builds the schema from scratch into the empty database, seed data included.
  # Runs to completion and exits; nothing else may write DDL.
  # Runs the database module's own liquibase-maven-plugin rather than the
  # liquibase/liquibase image. That image ships no MySQL driver, and adding one
  # would pin the driver version in a second place; here the module's pom stays
  # the single source of truth for both the changelogs and the connector.
  photo-app-liquibase:
    image: maven:3.9-eclipse-temurin-25
    container_name: photo-app-liquibase
    networks: [photo-app-net]
    depends_on:
      photo-app-mysql:
        condition: service_healthy
    working_dir: /work
    volumes:
      - ./database:/work:ro
      - photo-app-maven-cache:/root/.m2
    command: >
      mvn -B -q liquibase:update
      -Ddb.host=photo-app-mysql
      -Ddb.port=3306
      -Ddb.name=${MYSQL_DATABASE:-photo_app}
      -Ddb.username=${MYSQL_USER:-photo_app_user}
      -Ddb.password=${MYSQL_PASSWORD}
    restart: "no"

  # --------------------------------------------------------------- RabbitMQ
  photo-app-rabbitmq:
    image: rabbitmq:3-management
    container_name: photo-app-rabbitmq
    networks: [photo-app-net]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ----------------------------------------------------------------- Zipkin
  photo-app-zipkin:
    image: openzipkin/zipkin
    container_name: photo-app-zipkin
    networks: [photo-app-net]
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------- ELK bootstrap, stage 1
  # One-shot: generates a self-signed CA and an Elasticsearch server certificate
  # into a shared volume, then exits. Must complete before Elasticsearch starts.
  # Self-signed is fine locally; the point is that the security model is the same
  # one production requires.
  photo-app-elk-certs:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.13.0}
    container_name: photo-app-elk-certs
    networks: [photo-app-net]
    user: "0"
    volumes:
      - photo-app-certs:/certs
      - ./docker/elk/setup/certs.sh:/certs.sh:ro
    command: ["bash", "/certs.sh"]
    restart: "no"

  # ------------------------------------------------- ELK bootstrap, stage 2
  # kibana_system has no usable password until it is set through the API, which
  # requires a running cluster - hence a second one-shot after ES is healthy.
  photo-app-elk-users:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.13.0}
    container_name: photo-app-elk-users
    networks: [photo-app-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - photo-app-certs:/certs:ro
      - ./docker/elk/setup/users.sh:/users.sh:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD in .env}
    command: ["bash", "/users.sh"]
    restart: "no"

  # ---------------------------------------------------------- Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.13.0}
    container_name: photo-app-elasticsearch
    networks: [photo-app-net]
    depends_on:
      photo-app-elk-certs:
        condition: service_completed_successfully
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/es/es.key
      xpack.security.http.ssl.certificate: certs/es/es.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.license.self_generated.type: basic
    volumes:
      - photo-app-es-data:/usr/share/elasticsearch/data
      - photo-app-certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------- Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.13.0}
    container_name: photo-app-kibana
    networks: [photo-app-net]
    depends_on:
      photo-app-elk-users:
        condition: service_completed_successfully
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca/ca.crt
    volumes:
      - photo-app-certs:/usr/share/kibana/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # -------------------------------------------------------------- Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.13.0}
    container_name: photo-app-logstash
    networks: [photo-app-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      # Logstash's monitoring/license reader keeps its own connection and defaults
      # to http://elasticsearch:9200, which cannot work once TLS is enforced. The
      # pipeline output is configured separately and is unaffected.
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./docker/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - photo-app-certs:/usr/share/logstash/config/certs:ro
      # Replaces the old host bind mount of api-parent/services
      - photo-app-logs:/var/log/photo-app:ro
      - photo-app-logstash-data:/usr/share/logstash/data

  # =====================================================================
  # Application services (Step 8)
  #
  # Every one keeps SPRING_PROFILES_ACTIVE=dev - there is no "docker" profile.
  # Only the network-location-dependent properties are overridden here, through
  # OS environment variables, which outrank Config Server properties in Spring
  # Boot's resolution order. Business configuration stays in the config repo.
  # =====================================================================

  # Docker seeds a named volume's ownership from the image only when the volume is
  # empty AND the app image is the first thing to mount it. Anything else touching
  # it first - a debugging container, a previous stack version - leaves it owned by
  # root, and the non-root app user then cannot create its log directory. This
  # one-shot removes that ordering dependency by setting ownership explicitly.
  photo-app-logs-init:
    image: alpine:3
    container_name: photo-app-logs-init
    volumes:
      - photo-app-logs:/logs
    # 999:999 is the photoapp user created in the Dockerfile.
    command: ["sh", "-c", "chown -R 999:999 /logs && chmod 755 /logs"]
    restart: "no"

  photo-app-config-server:
    build:
      context: .
      args:
        MODULE_PATH: infrastructure/photo-app-configuration-server
        JAR_NAME: photo-app-configuration-server-0.0.1-SNAPSHOT.jar
        SERVICE_PORT: 8888
    image: photo-app-configuration-server:local
    container_name: photo-app-config-server
    networks: [photo-app-net]
    depends_on:
      photo-app-logs-init:
        condition: service_completed_successfully
      photo-app-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: git
      GIT_USERNAME: ${GIT_USERNAME:?set GIT_USERNAME in .env}
      GIT_TOKEN: ${GIT_TOKEN:?set GIT_TOKEN in .env}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?set KEYSTORE_PASSWORD in .env}
      CONFIG_SERVER_ADMIN_USER: ${CONFIG_SERVER_ADMIN_USER}
      CONFIG_SERVER_ADMIN_PASSWORD: ${CONFIG_SERVER_ADMIN_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_RABBITMQ_HOST: photo-app-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://photo-app-zipkin:9411/api/v2/spans
      # No EUREKA_URL: this server is deliberately not registered with Eureka.
      # Clients reach it by direct URL, so registering it would only add a
      # bootstrap chicken-and-egg problem.
    volumes:
      - photo-app-logs:/var/log/photo-app
      # The image contains no keystore; it is supplied only at runtime.
      - ./api-parent/infrastructure/photo-app-configuration-server/src/main/resources/keystore.p12:/app/BOOT-INF/classes/keystore.p12:ro

  photo-app-discovery-service:
    build:
      context: .
      args:
        MODULE_PATH: infrastructure/photo-app-discovery-service
        JAR_NAME: photo-app-discovery-service-0.0.1-SNAPSHOT.jar
        SERVICE_PORT: 8761
    image: photo-app-discovery-service:local
    container_name: photo-app-discovery-service
    networks: [photo-app-net]
    depends_on:
      photo-app-config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    environment:
      <<: *config-client
    # Discovery-specific: it registers nothing but must still report traces.
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://photo-app-zipkin:9411/api/v2/spans
      EUREKA_INSTANCE_HOSTNAME: photo-app-discovery-service
    volumes:
      - photo-app-logs:/var/log/photo-app

  photo-app-api-gateway:
    build:
      context: .
      args:
        MODULE_PATH: infrastructure/photo-app-api-gateway
        JAR_NAME: photo-app-api-gateway-0.0.1-SNAPSHOT.jar
        SERVICE_PORT: 8080
    image: photo-app-api-gateway:local
    container_name: photo-app-api-gateway
    networks: [photo-app-net]
    depends_on:
      photo-app-discovery-service:
        condition: service_healthy
    # The only application port published: everything else is reached through it.
    ports:
      - "8080:8080"
    environment:
      <<: *config-client
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:password@photo-app-discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: photo-app-api-gateway
      SPRING_RABBITMQ_HOST: photo-app-rabbitmq
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://photo-app-zipkin:9411/api/v2/spans
    volumes:
      - photo-app-logs:/var/log/photo-app

  # The five business services differ only by module, jar, port and hostname.
  # Ports are deliberately NOT published: they are reached through the gateway.
  photo-app-users-service:
    build:
      context: .
      args: {MODULE_PATH: services/photo-app-users-service, JAR_NAME: photo-app-users-service-0.0.1-SNAPSHOT.jar, SERVICE_PORT: 8081}
    image: photo-app-users-service:local
    container_name: photo-app-users-service
    networks: [photo-app-net]
    depends_on: &business-deps
      photo-app-logs-init:
        condition: service_completed_successfully
      photo-app-discovery-service:
        condition: service_healthy
      photo-app-mysql:
        condition: service_healthy
    environment: &business-env
      <<: *config-client
      SPRING_DATASOURCE_URL: jdbc:mysql://photo-app-mysql:3306/${MYSQL_DATABASE:-photo_app}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_RABBITMQ_HOST: photo-app-rabbitmq
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://photo-app-zipkin:9411/api/v2/spans
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:password@photo-app-discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: photo-app-users-service
    volumes: &business-volumes
      - photo-app-logs:/var/log/photo-app

  photo-app-accounts-service:
    build:
      context: .
      args: {MODULE_PATH: services/photo-app-accounts-service, JAR_NAME: photo-app-accounts-service-0.0.1-SNAPSHOT.jar, SERVICE_PORT: 8082}
    image: photo-app-accounts-service:local
    container_name: photo-app-accounts-service
    networks: [photo-app-net]
    depends_on: *business-deps
    environment:
      <<: *business-env
      EUREKA_INSTANCE_HOSTNAME: photo-app-accounts-service
    volumes: *business-volumes

  photo-app-albums-service:
    build:
      context: .
      args: {MODULE_PATH: services/photo-app-albums-service, JAR_NAME: photo-app-albums-service-0.0.1-SNAPSHOT.jar, SERVICE_PORT: 8083}
    image: photo-app-albums-service:local
    container_name: photo-app-albums-service
    networks: [photo-app-net]
    depends_on: *business-deps
    environment:
      <<: *business-env
      EUREKA_INSTANCE_HOSTNAME: photo-app-albums-service
    volumes: *business-volumes

  photo-app-photos-service:
    build:
      context: .
      args: {MODULE_PATH: services/photo-app-photos-service, JAR_NAME: photo-app-photos-service-0.0.1-SNAPSHOT.jar, SERVICE_PORT: 8084}
    image: photo-app-photos-service:local
    container_name: photo-app-photos-service
    networks: [photo-app-net]
    depends_on: *business-deps
    environment:
      <<: *business-env
      EUREKA_INSTANCE_HOSTNAME: photo-app-photos-service
    volumes: *business-volumes

  photo-app-authorization-service:
    build:
      context: .
      args: {MODULE_PATH: services/photo-app-authorization-service, JAR_NAME: photo-app-authorization-service-0.0.1-SNAPSHOT.jar, SERVICE_PORT: 8085}
    image: photo-app-authorization-service:local
    container_name: photo-app-authorization-service
    networks: [photo-app-net]
    depends_on: *business-deps
    environment:
      <<: *business-env
      EUREKA_INSTANCE_HOSTNAME: photo-app-authorization-service
    volumes: *business-volumes
